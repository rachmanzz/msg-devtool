name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (Chrome)
        run: npm run build:chrome

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Lint Firefox bundle
        run: npx --yes web-ext@10 lint --source-dir dist-firefox --no-input

      - name: Upload Chrome bundle
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: msgpack-devtools-chrome
          path: dist/

      - name: Upload Firefox bundle
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: msgpack-devtools-firefox
          path: dist-firefox/
